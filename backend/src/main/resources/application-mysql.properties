# MariaDB/MySQL local. Override DB_URL, DB_USERNAME, DB_PASSWORD with environment variables as needed.
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/fag247?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.h2.console.enabled=false
