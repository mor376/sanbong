server.port=8080
spring.profiles.default=mysql

# ---- H2 is used only when the h2 profile is explicitly activated ----
# The default profile connects to MariaDB/MySQL via application-mysql.properties.
spring.datasource.url=jdbc:h2:file:./data/sanbong;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.h2.console.enabled=true

# ---- JWT ----
# Khi triển khai thật: đặt biến môi trường JWT_SECRET (>= 32 ký tự), không commit khoá thật lên git
app.jwt.secret=${JWT_SECRET:doi-chuoi-nay-thanh-mot-khoa-bi-mat-dai-it-nhat-32-ky-tu-nhe}
app.jwt.expiration-ms=86400000
